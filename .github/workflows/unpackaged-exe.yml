name: Build EXE

# Manual unpackaged build. The project defaults to an MSIX package; this job
# publishes a self-contained folder whose Tunetastic.exe runs without the Store.
on:
  # Push on this branch starts the job before the file is on the default branch.
  # workflow_dispatch is what you use once this file is merged.
  push:
    branches: [build-exe-workflow]
  workflow_dispatch:
    inputs:
      platform:
        description: Architecture
        type: choice
        required: true
        default: x64
        options:
          - x64
          - ARM64

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish unpackaged app
        shell: pwsh
        run: |
          $platform = "${{ inputs.platform }}"
          $rid = if ($platform -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $out = "${{ github.workspace }}\publish"

          dotnet restore Tunetastic.csproj `
            --configfile nuget.config `
            -p:Platform=$platform `
            -p:RuntimeIdentifier=$rid `
            -p:SelfContained=true `
            -p:WindowsPackageType=None `
            -p:AppxPackageSigningEnabled=false

          dotnet publish Tunetastic.csproj `
            --no-restore `
            -c Release `
            -p:Platform=$platform `
            -p:RuntimeIdentifier=$rid `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:AppxPackage=false `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:CreateMSIXPackage=false `
            -o $out

      - name: Confirm Tunetastic.exe
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\publish\Tunetastic.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Publish finished without Tunetastic.exe."
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Zip publish folder
        id: zip
        shell: pwsh
        run: |
          $platform = "${{ inputs.platform }}".ToLower()
          $zip = "${{ github.workspace }}\Tunetastic-win-$platform.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=Tunetastic-win-$platform" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          compression-level: 0

      - name: Run summary
        shell: pwsh
        run: |
          @"
          ## Unpackaged executable

          Download the **${{ steps.zip.outputs.name }}** artifact from this run.
          The zip contains ``Tunetastic.exe`` plus the .NET and Windows App SDK files it needs. Extract the zip and run ``Tunetastic.exe``.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
