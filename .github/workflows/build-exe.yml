name: Build EXE (x64)

# Knop-workflow: ga in GitHub naar Actions > "Build EXE (x64)" > "Run workflow".
# Bouwt een losse Tunetastic.exe (x64, self-contained, unsigned) zonder MSIX,
# zonder signing, zonder auto-update en zonder repository secrets.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Buildconfiguratie
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug

concurrency:
  group: build-exe-x64
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: pwsh
        run: >
          dotnet restore Tunetastic.csproj
          --configfile nuget.config
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -p:AppxPackageSigningEnabled=false

      - name: Publish unpackaged app (x64)
        shell: pwsh
        run: >
          dotnet publish Tunetastic.csproj
          --no-restore
          -c ${{ inputs.configuration || 'Release' }}
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:AppxPackage=false
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false
          -p:CreateMSIXPackage=false
          -o "${{ github.workspace }}\publish"

      - name: Confirm Tunetastic.exe
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\publish\Tunetastic.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Publish finished without Tunetastic.exe."
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload artifact (exe only)
        uses: actions/upload-artifact@v4
        with:
          name: Tunetastic-win-x64
          path: ${{ github.workspace }}\publish\Tunetastic.exe
          if-no-files-found: error
          compression-level: 0

      - name: Run summary
        shell: pwsh
        run: |
          @"
          ## Tunetastic x64 (unpackaged)

          Download het **Tunetastic-win-x64** artifact van deze run.
          Dit bevat alleen ``Tunetastic.exe``.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
